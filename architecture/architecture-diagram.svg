<text x="200" y="1352" font-size="11.5" fill="#6b6b6b">Stateless services autoscale horizontally behind the mesh · DBs sharded by entity + read replicas per region · Search &amp; cache are eventually consistent via the event bus · Media served from CDN edge, never through app servers · Payments isolated in its own PCI-compliant boundary.</text>
